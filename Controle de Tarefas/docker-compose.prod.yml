services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hive_tarefas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    networks:
      - minha_rede
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  api:
    image: ${API_IMAGE:-bitechgestao/tarefas:1.1}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hive_tarefas}?schema=public
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Administrador Global}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@hive.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Admin123}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    command: sh -c "npm run db:push && npm run db:seed && npm run start"
    networks:
      - minha_rede
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  web:
    image: ${WEB_IMAGE:-bitechgestao/tarefas-web:1.1}
    ports:
      - target: 80
        published: ${WEB_PORT:-80}
        protocol: tcp
        mode: ingress
    networks:
      - minha_rede
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  db_data_prod:

networks:
  minha_rede:
    driver: overlay
