services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hive_tarefas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    networks:
      - hive-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  api:
    image: ${API_IMAGE:-hive-tarefas-api:latest}
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hive_tarefas}?schema=public
      NODE_ENV: production
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    command: sh -c "npm run db:push && npm run db:seed && npm run start"
    networks:
      - hive-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  web:
    image: ${WEB_IMAGE:-hive-tarefas-web:latest}
    ports:
      - target: 80
        published: ${WEB_PORT:-80}
        protocol: tcp
        mode: ingress
    networks:
      - hive-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  db_data_prod:

networks:
  hive-net:
    driver: overlay
